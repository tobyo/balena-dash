name: "Deploy to Balena"

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - README.md
  workflow_dispatch:

jobs:
  deploy:
    name: "Deploy-to-Balena"
    runs-on: "ubuntu-latest"
    steps:
      # yearly-calendar and calendar-reader are private submodules under a
      # different account, so the default GITHUB_TOKEN cannot read them.
      # SUBMODULES_TOKEN must be a PAT with read access to both.
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}

      # .balena/ is gitignored, so the build secrets the Dockerfiles expect
      # at /run/secrets/ have to be recreated on the runner.
      - name: Materialise balena build secrets
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          CALENDAR_ID_2: ${{ secrets.CALENDAR_ID_2 }}
        run: |
          set -euo pipefail
          mkdir -p .balena/secrets
          printf '%s' "$SERVICE_ACCOUNT_JSON" > .balena/secrets/service-account.json
          python3 -c "import json,sys; json.load(open('.balena/secrets/service-account.json'))" 2>/dev/null \
            || { echo "::error::SERVICE_ACCOUNT_JSON secret is missing or not valid JSON"; exit 1; }
          cat > .balena/balena.yml <<YAML
          build-secrets:
            services:
              yearly-calendar:
                - source: service-account.json
                  dest: service-account.json
          build-variables:
            services:
              yearly-calendar:
                - CALENDAR_ID=${CALENDAR_ID}
                - CALENDAR_ID_2=${CALENDAR_ID_2}
          YAML

      - name: Deploy to Balena
        uses: balena-io/deploy-to-balena-action@master
        with:
          balena_token: ${{ secrets.BALENA_API_KEY }}
          fleet: ${{ vars.BALENA_FLEET }}
