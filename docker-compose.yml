version: '2'
volumes:
  settings:
services:
  browser:
    build: ./browser
    privileged: true # required for UDEV to find plugged in peripherals such as a USB mouse
    ports:
        - '5011' # management API (optional)
        - '35173:35173' # Chromium debugging port (optional)
        - '35174:35174' # Chromium debugging port (optional)
    volumes:
      - 'settings:/data' # Only required if using PERSISTENT flag (see below)i
    environment:
      # yearly-calendar rotates the views itself; the browser only loads it once.
      LAUNCH_URL: 'http://yearly-calendar:3000?cycle=year,month,week&interval=180'
  scheduler:
    restart: always
    build: ./scheduler
    privileged: true
    devices:
      - "/dev/cec0:/dev/cec0"
    labels:
      io.balena.features.supervisor-api: '1' # nightly browser restart
  yearly-calendar:
    restart: always
    build: ./yearly-calendar
    ports:
      - "3000:3000"
